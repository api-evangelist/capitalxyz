aid: capitalxyz
name: Capital.xyz
description: >-
  Capital.xyz (the company behind the former Party Round) is a startup banking
  and fundraising platform that helps founders raise, hold, spend, and send
  money in one place. Companies sign up to run fundraising rounds, receive a
  virtual Visa debit card once capital is raised, hold and move funds, and
  connect the account to fintech services such as Gusto. The product is built on
  embedded-finance rails (Unit, Plaid, Visa) and is a consumer/SMB-facing
  application; as of this enrichment pass Capital.xyz publishes no public
  developer program, API reference, OpenAPI, or docs portal. Added to the API
  Evangelist network as a portfolio company of a16z.
